name: Make IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y zip wget

      - name: Replicate Author Method for Non-Jailbreak
        run: |
          # 1. Tải bản Filza gốc từ BigBoss
          wget http://apt.thebigboss.org/repofiles/cydia/debs2.0/com.tigisoftware.filza_4.0.1-4.deb -O filza.deb
          
          # 2. Giải nén cấu trúc file deb
          ar x filza.deb
          if [ -f data.tar.xz ]; then
            tar -xf data.tar.xz
          elif [ -f data.tar.gz ]; then
            tar -xf data.tar.gz
          fi
          
          # 3. Tạo cấu trúc thư mục Payload cho file IPA Non-Jailbreak
          mkdir -p Payload
          if [ -d Applications/Filza.app ]; then
            cp -r Applications/Filza.app Payload/
          elif [ -d Library/Applications/Filza.app ]; then
            cp -r Library/Applications/Filza.app Payload/
          fi
          
          # 4. Sửa quyền thực thi cho file chạy chính (bước bắt buộc cho máy Jailed/Non-JB)
          chmod +x Payload/Filza.app/Filza
          
          # 5. Đóng gói thành file IPA đúng chuẩn cấu trúc iOS
          zip -r Filza-Author-NonJailbreak.ipa Payload
          
          echo "--- ĐÃ ĐÓNG GÓI THÀNH CÔNG THEO PHƯƠNG PHÁP NON-JAILBREAK ---"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Filza-Author-IPA
          path: ./Filza-Author-NonJailbreak.ipa
