name: Make IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y zip wget

      - name: Run Author Maker Script
        run: |
          # 1. Tạo lệnh cmd.exe giả lập để script Windows/WSL của tác giả chạy được trên Linux
          sudo ln -s /bin/echo /usr/bin/cmd.exe
          
          # 2. Chạy chính xác file của tác giả và tự động "nhấn phím 1" để chọn bản Filza gốc
          echo "1" | bash Filza26Maker.sh

      - name: Find and Move IPA
        run: |
          # Kiểm tra và đưa file IPA được sinh ra từ script của tác giả ra thư mục gốc để đóng gói
          find . -name "*.ipa" -exec cp {} . \;

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Filza-IPA
          path: ./*.ipa
