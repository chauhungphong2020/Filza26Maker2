name: Make IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt update && sudo apt install -y zip

      - name: Run Maker Script
        run: |
          sudo ln -s /bin/echo /usr/bin/cmd.exe
          bash Filza26Maker.sh

      - name: Find and Move IPA
        run: |
          # Tìm file ipa ở các thư mục con (nếu có) và đưa ra thư mục gốc
          find . -name "*.ipa" -exec cp {} . \;

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Filza-IPA
          path: ./*.ipa
