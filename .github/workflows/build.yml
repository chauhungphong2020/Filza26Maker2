name: Make IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y zip wget

      - name: Create Fake Windows Environment for Author Script
        run: |
          # 1. Giả lập lệnh cmd.exe của Windows trên Linux
          sudo ln -s /bin/echo /usr/bin/cmd.exe
          
          # 2. Tạo đường dẫn Desktop ảo đúng như script của tác giả yêu cầu cứu cánh
          sudo mkdir -p /mnt/c/Users/runner/Desktop
          sudo chmod -R 777 /mnt/c
          
          # 3. Tải file .deb mồi tên 'filza.deb' vào đúng thư mục gốc
          wget http://apt.thebigboss.org/repofiles/cydia/debs2.0/com.tigisoftware.filza_4.0.1-4.deb -O filza.deb

      - name: Run Author Maker Script
        run: |
          # Chạy script gốc của tác giả, đặt tên máy tính ảo là 'runner' và tự chọn phím 1
          export username="runner"
          echo "1" | bash Filza26Maker.sh

      - name: Collect IPA from Fake Desktop
        run: |
          # Lấy file IPA đã được xử lý tối ưu cho Non-Jailbreak từ Desktop ảo ra ngoài
          cp /mnt/c/Users/runner/Desktop/*.ipa ./Filza-iOS-NonJailbreak.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Filza-Author-IPA
          path: ./Filza-iOS-NonJailbreak.ipa
