name: Make IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y zip

      - name: Build Directly From Author Files
        run: |
          # 1. Tạo cấu trúc thư mục Payload chuẩn iOS
          mkdir -p Payload
          
          # 2. Sao chép thư mục Filza.app gốc của tác giả vào Payload
          # (Tự động tìm kiếm vị trí thư mục .app trong kho để copy chính xác)
          APP_PATH=$(find . -name "Filza.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cp -r "$APP_PATH" Payload/
            echo "Tìm thấy Filza.app tại: $APP_PATH"
          else
            echo "Không tìm thấy thư mục Filza.app gốc!" && exit 1
          fi
          
          # 3. Sửa quyền thực thi (Bước cực kỳ quan trọng cho máy Non-Jailbreak để tránh văng app)
          chmod +x Payload/Filza.app/Filza
          
          # 4. Đóng gói thành file IPA chuẩn cho máy Jailed
          zip -r Filza-NonJailbreak.ipa Payload
          
          echo "--- ĐÃ ĐÓNG GÓI THÀNH CÔNG FILE IPA GỐC CỦA TÁC GIẢ ---"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Filza-Author-IPA
          path: ./Filza-NonJailbreak.ipa
