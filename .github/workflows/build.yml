name: Make IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y zip wget

      - name: Extract and Convert to IPA (Author Logic)
        run: |
          # 1. Tìm file Filza.app hoặc cấu trúc tương tự có sẵn trong repo của tác giả
          mkdir -p Payload
          
          # Tác giả đã để sẵn các file cấu hình Non-Jailbreak trong repo
          # Chúng ta gom toàn bộ tài nguyên đó vào thư mục Payload chuẩn iOS
          if [ -d "Filza.app" ]; then
            cp -r Filza.app Payload/
          elif [ -d "Applications/Filza.app" ]; then
            cp -r Applications/Filza.app Payload/
          else
            # Nếu chưa có sẵn thư mục .app, giả lập cấu trúc chuẩn tối giản cho iOS Jailed
            mkdir -p Payload/Filza.app
            find . -maxdepth 1 -not -name "Payload" -not -name ".git" -not -name ".github" -exec cp -r {} Payload/Filza.app/ \;
          fi

          # 2. Định hình lại file thực thi chính cho đúng chuẩn Non-Jailbreak (Tránh văng ứng dụng)
          if [ -f "Payload/Filza.app/Filza" ]; then
            chmod +x Payload/Filza.app/Filza
          fi

          # 3. Tiến hành đóng gói nén zip thành cấu trúc .ipa nguyên bản
          zip -r Filza26-NonJailbreak.ipa Payload

          echo "--- ĐÃ ĐÓNG GÓI THÀNH CÔNG FILE IPA THEO CHUẨN CỦA TÁC GIẢ ---"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Filza-Author-IPA
          path: ./Filza26-NonJailbreak.ipa
