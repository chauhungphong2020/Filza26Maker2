name: Make IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y zip wget

      - name: Fetch Filza Deb via Reliable GitHub CDN
        run: |
          # 1. Giả lập lệnh cmd.exe cho script tác giả
          sudo ln -s /bin/echo /usr/bin/cmd.exe
          
          # 2. Tải bản Filza chính thức từ kho lưu trữ CDN uy tín của GitHub (Đảm bảo thông suốt 100%)
          wget https://github.com/ichitaso/filza-next/releases/download/v4.0.0/com.tigisoftware.filza_4.0.0_iphoneos-arm.deb -O filza.deb

      - name: Run Author Maker Script
        run: |
          # 3. Sửa dòng lệnh di chuyển file Windows cuối script của tác giả để xuất file tại chỗ
          sed -i 's|mv Filza.ipa /mnt/c/.*|echo "Xong"|g' Filza26Maker.sh
          sed -i 's|mv Filza26.ipa /mnt/c/.*|echo "Xong"|g' Filza26Maker.sh
          
          # 4. Chạy script của tác giả và tự động chọn 1
          echo "1" | bash Filza26Maker.sh

      - name: Output IPA Verification
        run: |
          # 5. Gom file IPA do chính script tác giả vừa tạo ra
          find . -name "*.ipa" -exec cp {} ./Filza-Author-iOS26.ipa \;

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Filza-Author-IPA
          path: ./Filza-Author-iOS26.ipa
